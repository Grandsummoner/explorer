name: Build and Release VCV Rack Plugin (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            curl
            unzip
            zip
            jq

      - name: Download VCV Rack SDK
        shell: msys2 {0}
        run: |
          curl -o Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-2.5.2-win-x64.zip
          unzip -q Rack-SDK.zip

      - name: Build plugin package
        shell: msys2 {0}
        env:
          RACK_DIR: Rack-SDK
        run: |
          make -j2 dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Explorer-win-x64
          path: dist/*.vcvplugin

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0-windows' }}
          files: release-artifacts/**/*.vcvplugin
          generate_release_notes: true
          draft: false
          prerelease: false
