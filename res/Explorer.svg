<svg xmlns="http://www.w3.org/2000/svg" width="180" height="380" viewBox="0 0 180 380">
  <defs>
    <!-- Stellar Warm Cream Base Gradient -->
    <linearGradient id="stellarBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFE9DF"/>
      <stop offset="50%" stop-color="#EAE3D6"/>
      <stop offset="100%" stop-color="#E2DBD0"/>
    </linearGradient>

    <!-- Inset Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>

    <!-- Metallic Silver Bezel Gradient -->
    <linearGradient id="silverBezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>

    <!-- Cyan Status Indicator Gem -->
    <radialGradient id="cyanGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </radialGradient>

    <!-- Terracotta Audio Out Ring Gradient -->
    <linearGradient id="orangeRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Panel Plate (12 HP Eurorack) -->
  <rect width="180" height="380" fill="url(#stellarBase)"/>

  <!-- Left and right subtle bevel border -->
  <line x1="0.5" y1="0" x2="0.5" y2="380" stroke="#FAF7F2" stroke-width="1"/>
  <line x1="179.5" y1="0" x2="179.5" y2="380" stroke="#C8BFAD" stroke-width="1"/>

  <!-- 2. Standard Eurorack Oval Mounting Slots -->
  <g fill="#A89F8E" stroke="#78716C" stroke-width="0.6">
    <rect x="7.5" y="3" width="15" height="4.5" rx="2.25"/>
    <rect x="157.5" y="3" width="15" height="4.5" rx="2.25"/>
    <rect x="7.5" y="372.5" width="15" height="4.5" rx="2.25"/>
    <rect x="157.5" y="372.5" width="15" height="4.5" rx="2.25"/>
  </g>

  <!-- 3. Top-Right Cyan Status Gem & Top-Left Dark Rivet (Signature Stellar Details) -->
  <!-- Top Left Rivet -->
  <circle cx="14" cy="14" r="3.5" fill="#292524" stroke="#78716C" stroke-width="0.8"/>
  <circle cx="14" cy="14" r="1.5" fill="#44403C"/>

  <!-- Top Right Cyan Status Gem -->
  <circle cx="166" cy="14" r="4.2" fill="#D4D4D8" stroke="#71717A" stroke-width="0.75"/>
  <circle cx="166" cy="14" r="3.0" fill="url(#cyanGem)"/>
  <circle cx="165" cy="13" r="1.0" fill="#FFFFFF" opacity="0.8"/>

  <!-- Top Decorative Header Rule -->
  <line x1="24" y1="46" x2="156" y2="46" stroke="#D5CDBD" stroke-width="0.8"/>
  <line x1="68" y1="46" x2="112" y2="46" stroke="#0E7490" stroke-width="1.2"/>

  <!-- 4. Section 1: AUDIO I/O Card (Y: 52 to 92) -->
  <rect x="16" y="52" width="152" height="40" rx="3.5" fill="url(#cardGrad)" stroke="#D5CDBD" stroke-width="0.8"/>
  <!-- Left section stripe -->
  <rect x="16" y="52" width="3" height="40" rx="1.5" fill="#44403C"/>

  <!-- Audio In Jacks Bezels (X: 30, 70, Y: 72) -->
  <circle cx="30" cy="72" r="11" fill="#EAE3D6" stroke="#C4BCAB" stroke-width="0.8"/>
  <circle cx="30" cy="72" r="9.5" fill="#F4EFE6" stroke="#78716C" stroke-width="0.6"/>

  <circle cx="70" cy="72" r="11" fill="#EAE3D6" stroke="#C4BCAB" stroke-width="0.8"/>
  <circle cx="70" cy="72" r="9.5" fill="#F4EFE6" stroke="#78716C" stroke-width="0.6"/>

  <!-- Audio Out Jacks Terracotta Rings (X: 110, 150, Y: 72) -->
  <circle cx="110" cy="72" r="11" fill="#FED7AA" stroke="#EA580C" stroke-width="1.2"/>
  <circle cx="110" cy="72" r="9.5" fill="#FFF7ED" stroke="#C2410C" stroke-width="0.6"/>

  <circle cx="150" cy="72" r="11" fill="#FED7AA" stroke="#EA580C" stroke-width="1.2"/>
  <circle cx="150" cy="72" r="9.5" fill="#FFF7ED" stroke="#C2410C" stroke-width="0.6"/>

  <!-- 5. Section 2: CONTROLS / BUTTONS Card (Y: 98 to 128) -->
  <rect x="16" y="98" width="152" height="30" rx="3.5" fill="url(#cardGrad)" stroke="#D5CDBD" stroke-width="0.8"/>
  <rect x="16" y="98" width="3" height="30" rx="1.5" fill="#78716C"/>

  <!-- 3 Button Mounting Recesses (X: 40, 90, 140, Y: 111) -->
  <rect x="30" y="102" width="20" height="18" rx="2" fill="#E5DFD4" stroke="#B8AFA0" stroke-width="0.8"/>
  <rect x="80" y="102" width="20" height="18" rx="2" fill="#E5DFD4" stroke="#B8AFA0" stroke-width="0.8"/>
  <rect x="130" y="102" width="20" height="18" rx="2" fill="#E5DFD4" stroke="#B8AFA0" stroke-width="0.8"/>

  <!-- 6. Section 3: DSP KNOBS Card (Y: 134 to 276) -->
  <rect x="16" y="134" width="152" height="142" rx="3.5" fill="url(#cardGrad)" stroke="#D5CDBD" stroke-width="0.8"/>
  <rect x="16" y="134" width="3" height="142" rx="1.5" fill="#0E7490"/>

  <!-- Circular background halos for 6 Knobs & LED Rings -->
  <!-- Row 1: (34, 160), (90, 160), (146, 160) -->
  <circle cx="34" cy="160" r="22" fill="#EBE5D8" stroke="#D8D1C2" stroke-width="0.75"/>
  <circle cx="34" cy="160" r="13" fill="#D5CDBD" opacity="0.4"/>

  <circle cx="90" cy="160" r="22" fill="#EBE5D8" stroke="#D8D1C2" stroke-width="0.75"/>
  <circle cx="90" cy="160" r="13" fill="#D5CDBD" opacity="0.4"/>

  <circle cx="146" cy="160" r="22" fill="#EBE5D8" stroke="#D8D1C2" stroke-width="0.75"/>
  <circle cx="146" cy="160" r="13" fill="#D5CDBD" opacity="0.4"/>

  <!-- Row 2: (34, 220), (90, 220), (146, 220) -->
  <circle cx="34" cy="220" r="22" fill="#EBE5D8" stroke="#D8D1C2" stroke-width="0.75"/>
  <circle cx="34" cy="220" r="13" fill="#D5CDBD" opacity="0.4"/>

  <circle cx="90" cy="220" r="22" fill="#EBE5D8" stroke="#D8D1C2" stroke-width="0.75"/>
  <circle cx="90" cy="220" r="13" fill="#D5CDBD" opacity="0.4"/>

  <circle cx="146" cy="220" r="22" fill="#EBE5D8" stroke="#D8D1C2" stroke-width="0.75"/>
  <circle cx="146" cy="220" r="13" fill="#D5CDBD" opacity="0.4"/>

  <!-- 7. Section 4: FIELD CV JACKS Card (Y: 284 to 366) -->
  <rect x="16" y="284" width="152" height="82" rx="3.5" fill="url(#cardGrad)" stroke="#D5CDBD" stroke-width="0.8"/>
  <rect x="16" y="284" width="3" height="82" rx="1.5" fill="#4338CA"/>

  <!-- Row 1: CV 1-3 Cyan Collar Bezels (Y: 309) -->
  <circle cx="34" cy="309" r="10.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
  <circle cx="34" cy="309" r="9" fill="#F0F9FF" stroke="#0369A1" stroke-width="0.5"/>

  <circle cx="90" cy="309" r="10.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
  <circle cx="90" cy="309" r="9" fill="#F0F9FF" stroke="#0369A1" stroke-width="0.5"/>

  <circle cx="146" cy="309" r="10.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
  <circle cx="146" cy="309" r="9" fill="#F0F9FF" stroke="#0369A1" stroke-width="0.5"/>

  <!-- Row 2: CV 4-6 Violet Collar Bezels (Y: 345) -->
  <circle cx="34" cy="345" r="10.5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.0"/>
  <circle cx="34" cy="345" r="9" fill="#F5F3FF" stroke="#6D28D9" stroke-width="0.5"/>

  <circle cx="90" cy="345" r="10.5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.0"/>
  <circle cx="90" cy="345" r="9" fill="#F5F3FF" stroke="#6D28D9" stroke-width="0.5"/>

  <circle cx="146" cy="345" r="10.5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.0"/>
  <circle cx="146" cy="345" r="9" fill="#F5F3FF" stroke="#6D28D9" stroke-width="0.5"/>
</svg>
