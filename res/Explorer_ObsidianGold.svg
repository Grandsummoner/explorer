<svg xmlns="http://www.w3.org/2000/svg" width="180" height="380" viewBox="0 0 180 380">
  <defs>
    <!-- Background brushed black anodized aluminum -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1a1a1e"/>
      <stop offset="50%" stopColor="#121215"/>
      <stop offset="100%" stopColor="#0b0b0d"/>
    </linearGradient>

    <!-- Subtle horizontal brush lines -->
    <pattern id="brushLines" width="180" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="180" y2="1" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
    </pattern>

    <!-- Gold metallic gradient for Explorer logo -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#fbbf24"/>
      <stop offset="50%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Panel Base Plate -->
  <rect width="180" height="380" fill="url(#bgGrad)"/>
  <rect width="180" height="380" fill="url(#brushLines)"/>

  <!-- Left and right bevel borders -->
  <line x1="1" y1="0" x2="1" y2="380" stroke="#3f3f46" stroke-width="1" opacity="0.6"/>
  <line x1="179" y1="0" x2="179" y2="380" stroke="#27272a" stroke-width="1" opacity="0.6"/>

  <!-- Eurorack Mounting Screws (12 HP standard oval slots) -->
  <g fill="#09090b" stroke="#3f3f46" stroke-width="0.8">
    <rect x="7.5" y="3" width="15" height="4.5" rx="2.25"/>
    <rect x="157.5" y="3" width="15" height="4.5" rx="2.25"/>
    <rect x="7.5" y="372.5" width="15" height="4.5" rx="2.25"/>
    <rect x="157.5" y="372.5" width="15" height="4.5" rx="2.25"/>
  </g>

  <!-- Header Silk-Screen -->
  <text x="90" y="24" fill="#a1a1aa" font-family="'DejaVu Sans', sans-serif" font-weight="900" font-size="6.5" letter-spacing="2" text-anchor="middle">HERMETIC MODULAR</text>
  <text x="90" y="38" fill="url(#goldGrad)" font-family="'DejaVu Sans', sans-serif" font-weight="900" font-size="11" letter-spacing="3" text-anchor="middle">EXPLORER</text>
  <line x1="20" y1="44" x2="160" y2="44" stroke="#27272a" stroke-width="0.8"/>
  <line x1="60" y1="44" x2="120" y2="44" stroke="#d97706" stroke-width="0.8"/>

  <!-- Top Audio I/O Section (Y: 52 to 86) -->
  <rect x="8" y="48" width="164" height="42" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
  <text x="30" y="58" fill="#71717a" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">IN L</text>
  <text x="70" y="58" fill="#71717a" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">IN R</text>
  <text x="110" y="58" fill="#f59e0b" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">OUT L</text>
  <text x="150" y="58" fill="#f59e0b" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">OUT R</text>

  <!-- Jack target centers (Top Audio) -->
  <circle cx="30" cy="72" r="10" fill="none" stroke="#27272a" stroke-width="0.75"/>
  <circle cx="70" cy="72" r="10" fill="none" stroke="#27272a" stroke-width="0.75"/>
  <circle cx="110" cy="72" r="10" fill="none" stroke="#d97706" stroke-width="0.75" opacity="0.6"/>
  <circle cx="150" cy="72" r="10" fill="none" stroke="#d97706" stroke-width="0.75" opacity="0.6"/>

  <!-- 3 Tactile Pushbuttons Section (Y: 96 to 118) -->
  <rect x="12" y="96" width="156" height="22" rx="2" fill="#141417" stroke="#27272a" stroke-width="0.6"/>
  <text x="40" y="104" fill="#a1a1aa" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">PAGE</text>
  <circle cx="40" cy="111" r="4" fill="#27272a" stroke="#3f3f46" stroke-width="0.5"/>

  <text x="90" y="104" fill="#fbbf24" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">LOCK</text>
  <circle cx="90" cy="111" r="4" fill="#27272a" stroke="#d97706" stroke-width="0.5"/>

  <text x="140" y="104" fill="#a1a1aa" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">PRESET</text>
  <circle cx="140" cy="111" r="4" fill="#27272a" stroke="#3f3f46" stroke-width="0.5"/>

  <!-- 6 Knobs with 16-LED rings section (Y: 126 to 280) -->
  <!-- Row 1: Knobs 1, 2, 3 (Center Y: 160) -->
  <!-- Knob 1 -->
  <circle cx="34" cy="160" r="18" fill="none" stroke="#27272a" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="34" y="137" fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="700" text-anchor="middle">KNOB 1</text>
  <!-- Knob 2 -->
  <circle cx="90" cy="160" r="18" fill="none" stroke="#27272a" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="90" y="137" fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="700" text-anchor="middle">KNOB 2</text>
  <!-- Knob 3 -->
  <circle cx="146" cy="160" r="18" fill="none" stroke="#27272a" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="146" y="137" fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="700" text-anchor="middle">KNOB 3</text>

  <!-- Row 2: Knobs 4, 5, 6 (Center Y: 220) -->
  <!-- Knob 4 -->
  <circle cx="34" cy="220" r="18" fill="none" stroke="#27272a" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="34" y="197" fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="700" text-anchor="middle">KNOB 4</text>
  <!-- Knob 5 -->
  <circle cx="90" cy="220" r="18" fill="none" stroke="#27272a" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="90" y="197" fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="700" text-anchor="middle">KNOB 5</text>
  <!-- Knob 6 -->
  <circle cx="146" cy="220" r="18" fill="none" stroke="#27272a" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="146" y="197" fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="700" text-anchor="middle">KNOB 6</text>

  <!-- 6 Field-Programmable Jacks Section (Y: 275 to 355) -->
  <rect x="8" y="270" width="164" height="88" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
  <text x="90" y="282" fill="#a1a1aa" font-family="'DejaVu Sans', sans-serif" font-size="5.5" font-weight="800" letter-spacing="1.5" text-anchor="middle">FIELD PROGRAMMABLE CV</text>

  <!-- Row 1 of Field Jacks: 1, 2, 3 -->
  <g fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">
    <text x="34" y="295">CV 1</text>
    <circle cx="34" cy="309" r="10" fill="none" stroke="#d97706" stroke-width="0.75"/>

    <text x="90" y="295">CV 2</text>
    <circle cx="90" cy="309" r="10" fill="none" stroke="#d97706" stroke-width="0.75"/>

    <text x="146" y="295">CV 3</text>
    <circle cx="146" cy="309" r="10" fill="none" stroke="#d97706" stroke-width="0.75"/>
  </g>

  <!-- Row 2 of Field Jacks: 4, 5, 6 -->
  <g fill="#e4e4e7" font-family="'DejaVu Sans', sans-serif" font-size="5" font-weight="700" text-anchor="middle">
    <text x="34" y="333">CV 4</text>
    <circle cx="34" cy="345" r="10" fill="none" stroke="#d97706" stroke-width="0.75"/>

    <text x="90" y="333">CV 5</text>
    <circle cx="90" cy="345" r="10" fill="none" stroke="#d97706" stroke-width="0.75"/>

    <text x="146" y="333">CV 6</text>
    <circle cx="146" cy="345" r="10" fill="none" stroke="#d97706" stroke-width="0.75"/>
  </g>

  <!-- Footer Branding -->
  <text x="90" y="370" fill="#52525b" font-family="'DejaVu Sans', sans-serif" font-size="4.5" letter-spacing="1.5" text-anchor="middle">DAISY SEED · 12 HP · 3U</text>
</svg>
